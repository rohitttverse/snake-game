<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game 🐍</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #fff;
    gap: 16px;
    padding: 16px;
  }
  h1 {
    font-size: 2rem;
    background: linear-gradient(90deg, #00f260, #f79d00);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  #scoreboard {
    display: flex;
    gap: 24px;
    font-size: 1.1rem;
  }
  #scoreboard span { color: #00f260; font-weight: bold; }
  #stage { position: relative; }
  canvas {
    background: #1a1a2e;
    border: 3px solid #00f260;
    border-radius: 8px;
    box-shadow: 0 0 25px rgba(0, 242, 96, 0.35);
    max-width: 92vw;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: rgba(0, 0, 0, 0.72);
    border-radius: 8px;
    text-align: center;
  }
  #overlay h2 { font-size: 1.6rem; }
  #overlay button {
    padding: 10px 26px;
    font-size: 1rem;
    font-weight: bold;
    border: none;
    border-radius: 25px;
    background: linear-gradient(90deg, #00f260, #05c46b);
    color: #062;
    cursor: pointer;
    transition: transform 0.15s;
  }
  #overlay button:hover { transform: scale(1.08); }
  #hint { color: #aaa; font-size: 0.9rem; }
  #dpad {
    display: grid;
    grid-template-columns: repeat(3, 56px);
    gap: 6px;
    margin-top: 4px;
  }
  #dpad button {
    height: 48px;
    font-size: 1.3rem;
    border: none;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.12);
    color: #fff;
    cursor: pointer;
    touch-action: manipulation;
  }
  #dpad button:active { background: #00f260; color: #062; }
  .empty { visibility: hidden; }
  @media (hover: hover) and (pointer: fine) {
    #dpad { display: none; }
  }
</style>
</head>
<body>
  <h1>🐍 Snake Game</h1>
  <div id="scoreboard">
    <div>Score: <span id="score">0</span></div>
    <div>Best: <span id="best">0</span></div>
  </div>
  <div id="stage">
    <canvas id="game" width="480" height="480"></canvas>
    <div id="overlay">
      <h2 id="msg">Snake Game!</h2>
      <p id="sub">Arrow keys / WASD ya buttons se khelo</p>
      <button id="startBtn">▶ Start</button>
    </div>
  </div>
  <div id="dpad">
    <button class="empty"></button>
    <button data-dir="up">▲</button>
    <button class="empty"></button>
    <button data-dir="left">◀</button>
    <button data-dir="down">▼</button>
    <button data-dir="right">▶</button>
  </div>
  <p id="hint">Space = Pause</p>

gi<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const overlay = document.getElementById('overlay');
const msgEl = document.getElementById('msg');
const subEl = document.getElementById('sub');
const startBtn = document.getElementById('startBtn');

const GRID = 24;                       // grid cells per side
const CELL = canvas.width / GRID;      // pixel size of one cell
const BASE_SPEED = 130;                // ms per move at start

let snake, dir, nextDir, food, score, best, timer, paused, speed;
best = +(localStorage.getItem('snakeBest') || 0);
bestEl.textContent = best;

function reset() {
  const mid = Math.floor(GRID / 2);
  snake = [{ x: mid, y: mid }, { x: mid - 1, y: mid }, { x: mid - 2, y: mid }];
  dir = { x: 1, y: 0 };
  nextDir = dir;
  score = 0;
  speed = BASE_SPEED;
  scoreEl.textContent = 0;
  placeFood();
}

function placeFood() {
  do {
    food = {
      x: Math.floor(Math.random() * GRID),
      y: Math.floor(Math.random() * GRID)
    };
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function step() {
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  // wall ya khud se takrana
  const hitWall = head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID;
  const hitSelf = snake.some(s => s.x === head.x && s.y === head.y);
  if (hitWall || hitSelf) return gameOver();

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreEl.textContent = score;
    speed = Math.max(60, speed - 3);   // khane par tez hota hai
    clearInterval(timer);
    timer = setInterval(step, speed);
    placeFood();
  } else {
    snake.pop();
  }
  draw();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // checkerboard background
  for (let y = 0; y < GRID; y++)
    for (let x = 0; x < GRID; x++) {
      ctx.fillStyle = (x + y) % 2 ? '#171730' : '#1a1a2e';
      ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
    }

  // food
  ctx.fillStyle = '#ff4757';
  ctx.beginPath();
  ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL * 0.36, 0, Math.PI * 2);
  ctx.fill();

  // snake
  snake.forEach((s, i) => {
    const t = i / snake.length;
    ctx.fillStyle = i === 0 ? '#00ff88' : `rgba(0, 220, 120, ${1 - t * 0.6})`;
    ctx.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2);
  });

  // aankhein
  const h = snake[0];
  ctx.fillStyle = '#062';
  ctx.beginPath();
  ctx.arc(h.x * CELL + CELL * 0.32, h.y * CELL + CELL * 0.32, 2.5, 0, Math.PI * 2);
  ctx.arc(h.x * CELL + CELL * 0.68, h.y * CELL + CELL * 0.32, 2.5, 0, Math.PI * 2);
  ctx.fill();
}

function gameOver() {
  clearInterval(timer);
  if (score > best) {
    best = score;
    localStorage.setItem('snakeBest', best);
    bestEl.textContent = best;
  }
  msgEl.textContent = 'Game Over! 💀';
  subEl.textContent = `Score: ${score} | Best: ${best}`;
  startBtn.textContent = '↻ Phir se khelo';
  overlay.style.display = 'flex';
}

function start() {
  reset();
  overlay.style.display = 'none';
  paused = false;
  draw();
  timer = setInterval(step, speed);
}

function turn(nx, ny) {
  // 180 degree turn block
  if (dir.x === -nx && dir.y === -ny) return;
  nextDir = { x: nx, y: ny };
}

document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  const moves = {
    arrowup: [0, -1], w: [0, -1],
    arrowdown: [0, 1], s: [0, 1],
    arrowleft: [-1, 0], a: [-1, 0],
    arrowright: [1, 0], d: [1, 0]
  };
  if (moves[k]) {
    e.preventDefault();
    if (timer && !paused) turn(...moves[k]);
  }
  if (k === ' ' && timer) {
    e.preventDefault();
    paused = !paused;
    if (paused) {
      clearInterval(timer);
      msgEl.textContent = 'Paused ⏸';
      subEl.textContent = 'Space dabao continue karne ke liye';
      startBtn.textContent = '▶ Continue';
      overlay.style.display = 'flex';
    } else {
      overlay.style.display = 'none';
      timer = setInterval(step, speed);
    }
  }
});

document.querySelectorAll('#dpad button[data-dir]').forEach(btn => {
  btn.addEventListener('click', () => {
    const d = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] }[btn.dataset.dir];
    if (timer && !paused) turn(...d);
  });
});

// swipe support
let touchX = 0, touchY = 0;
canvas.addEventListener('touchstart', e => {
  touchX = e.touches[0].clientX;
  touchY = e.touches[0].clientY;
});
canvas.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchX;
  const dy = e.changedTouches[0].clientY - touchY;
  if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
  if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0);
  else turn(0, dy > 0 ? 1 : -1);
});

startBtn.addEventListener('click', () => {
  if (paused) {
    paused = false;
    overlay.style.display = 'none';
    timer = setInterval(step, speed);
  } else {
    start();
  }
});
</script>
</body>
</html>
